name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: driver_feedback_test
          POSTGRES_USER: driver_feedback
          POSTGRES_PASSWORD: driver_feedback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driver_feedback -d driver_feedback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://driver_feedback:driver_feedback@127.0.0.1:5432/driver_feedback_test
      DATABASE_SSL_MODE: disable
      TEST_DATABASE_URL: postgresql://driver_feedback:driver_feedback@127.0.0.1:5432/driver_feedback_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t driver-feedback-api:${{ github.sha }} .
      - run: docker build --target migrator -t driver-feedback-migrator:${{ github.sha }} .
