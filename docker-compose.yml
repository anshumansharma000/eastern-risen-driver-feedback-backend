services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: driver_feedback
      POSTGRES_USER: driver_feedback
      POSTGRES_PASSWORD: driver_feedback
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driver_feedback -d driver_feedback"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - driver_feedback_postgres:/var/lib/postgresql

volumes:
  driver_feedback_postgres:
